name: CI

# ─────────────────────────────────────────────────────────────────────────
# Backend checks only, deliberately. The ad-hoc scripts in Backend/ named
# test*.py (test.py, test_action.py, test_generate.py, test_models.py,
# test_router.py) make LIVE calls to Gemini/Firestore and print output —
# they are manual diagnostics, not CI-safe tests, and are intentionally
# NOT run here (they'd fail on a runner with no GEMINI_API_KEY / Firebase
# credentials, which would make this pipeline red for the wrong reason).
# The Backend/tests/ suite added alongside the agent fixes is pure-Python
# and needs no secrets, so it runs safely on every push.
#
# NOTE: this assumes the backend lives at ./backend relative to the repo
# root, matching this repo's actual folder name. If you rename the folder,
# update `working-directory` below to match.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check every Python file
        run: python -m compileall -q .

      - name: Run the dependency-free test suite
        run: pytest tests/ -v
